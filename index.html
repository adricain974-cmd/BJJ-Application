function normalize(b) {
  const out = {v: 2, belt: {color: BELTS[b?.belt?.color] ? b.belt.color : 'blanche', stripes: Math.max(0, Math.min(b?.belt?.color === 'noire' ? 6 : 4, +b?.belt?.stripes || 0))}, positions: [], moves: []};
  for (const p of (Array.isArray(b?.positions) ? b.positions : [])) {
    if (!ID_OK.test(String(p?.id))) continue;
    const sides = (Array.isArray(p.sides) ? p.sides : []).map(String).filter(Boolean).slice(0, 2);
    out.positions.push({id: String(p.id), nom: String(p.nom || '?'), sides: sides.length ? sides : ['—']});
  }
  const ok = r => { const p = out.positions.find(x => x.id === String(r).split(':')[0]); return p && rs(r) < p.sides.length; };
  for (const m of (Array.isArray(b?.moves) ? b.moves : [])) {
    if (!ok(m?.from) || !(m.to === 'fin' || ok(m.to))) continue;
    out.moves.push({id: ID_OK.test(String(m.id)) ? String(m.id) : uid('m'), nom: String(m.nom || '?'), from: String(m.from), to: String(m.to), type: String(m.type || 'Transition'), status: STATUS[m.status] ? m.status : 'learning', gi: GI[m.gi] ? m.gi : 'both', details: String(m.details ?? m.notes ?? ''), tips: String(m.tips || ''), danger: String(m.danger || ''), video: String(m.video || ''), g: m.g && ID_OK.test(String(m.g)) ? String(m.g) : ''});
  }
  const days = b?.dojo?.days;
  out.dojo = {days: Array.isArray(days) && days.length === 7 && days.some(Boolean) ? days.map(Boolean) : [true, true, true, true, true, true, true]};
  out.journal = {};
  for (const [k, e] of Object.entries(b?.journal && typeof b.journal === 'object' ? b.journal : {})) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
    const techs = (Array.isArray(e?.techs) ? e.techs : []).map(t => ({id: t?.id && ID_OK.test(String(t.id)) ? String(t.id) : '', nom: String(t?.nom || '').slice(0, 120)})).filter(t => t.nom);
    const ent = {techs, feel: String(e?.feel || ''), good: String(e?.good || ''), bad: String(e?.bad || '')};
    if (techs.length || ent.feel || ent.good || ent.bad) out.journal[k] = ent;
  }
  return out;
}
const dirtyYears = new Set();
function save(year) {
  if (year) dirtyYears.add(year);
  if (docRef) { dirty = true; clearTimeout(saveT); saveT = setTimeout(flush, 700); }
  else { try { localStorage.setItem(LS, JSON.stringify(data)); } catch (_) { toast('Mémoire du navigateur pleine : fais une sauvegarde.'); } }
}
async function flush() {
  if (saving || !dirty || !docRef) return;
  saving = true; dirty = false;
  try {
    const plan = JSON.parse(JSON.stringify(data)); delete plan.journal;
    await docRef.set(plan);
    if (dirtyYears.has('all')) { dirtyYears.delete('all'); Object.keys(data.journal).forEach(k => dirtyYears.add(k.slice(0, 4))); }
    for (const y of [...dirtyYears]) {
      const entries = {};
      for (const [k, e] of Object.entries(data.journal)) if (k.startsWith(y)) entries[k] = e;
      await jColl.doc('journal-' + y).set({entries: JSON.parse(JSON.stringify(entries))});
      dirtyYears.delete(y);
    }
  }
  catch (e) {
    const c = e?.code || 'unavailable';
    if (c === 'unavailable' || c === 'resource_exhausted') { dirty = true; setTimeout(flush, 1500 + Math.random() * 1500); }
    else if (c === 'invalid_argument' || c === 'not_granted') { docRef = null; toast('Lecture seule : tes modifications ne sont pas enregistrées.'); }
    else toast('Enregistrement impossible (' + c + ').');
  }
  saving = false;
  if (dirty) flush();
}

function paths(start) {
  const out = [];
  const walk = (r, seen, path) => {
    if (out.length >= 40 || path.length >= 4) return;
    for (const m of data.moves) {
      if (m.from !== r || !vis(m)) continue;
      if (m.to === 'fin') { out.push([...path, m]); continue; }
      if (seen.has(m.to)) continue;
      walk(m.to, new Set([...seen, m.to]), [...path, m]);
    }
  };
  walk(start, new Set([start]), []);
  return out.sort((a, b) => a.length - b.length);
}

  return `<main class="page"><div class="hhead"><div><p class="eyebrow">Mon jeu</p><h1 class="ser">Séquences</h1></div></div>
  <p class="count">Tous les chemins vers une soumission, en quatre techniques au plus.</p>

}

const MONTHS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const dkey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const kdate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const fmtDay = k => { const d = kdate(k); return d.getDate() + ' ' + MONTHS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
function weekDays(off) {
  const d = new Date(); d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() - (d.getDay() + 6) % 7 + off * 7);
  return [...Array(7)].map((_, i) => { const x = new Date(d); x.setDate(d.getDate() + i); return x; });
}

    const form = `<form id="fp">
    <label class="f">Nom<input name="nom" required value="${esc(p?.nom)}" placeholder="ex. Garde Worm"></label>
    <label class="f">Premier côté<input name="s0" required value="${esc(p ? p.sides[0] : 'Dessus')}"></label>
    <label class="f">Deuxième côté <span class="hint">(vide si la position n'a qu'un côté)</span><input name="s1" value="${esc(p ? p.sides[1] || '' : 'Dessous')}"></label>
    <div class="acts"><button class="btn">${p ? 'Enregistrer' : 'Créer la position'}</button><button type="button" class="btn ghost" data-act="close">Annuler</button>${p && !used ? `<button type="button" class="btn danger" data-act="delpos" data-id="${esc(p.id)}">${delArm === p.id ? 'Confirmer' : 'Supprimer'}</button>` : ''}</div>
    ${p && used ? '<p class="hint">Pour supprimer cette position, retire d\'abord les techniques qui la concernent.</p>' : ''}</form>`;
    body = p ? `<h2 class="ser" id="sh-t">Modifier la position</h2>${form}`
      : `<h2 class="ser" id="sh-t">Ajouter une position</h2><label class="f">Chercher dans la banque<input id="psearch" type="search" placeholder="ex. De La Riva, nord-sud…" autocomplete="off"></label><div id="pres" class="bres"></div>
      <details class="uses"><summary>Créer une position personnalisée</summary>${form}</details>`;
  } else {
    body = `<h2 class="ser" id="sh-t">Afficher</h2><p class="hint">Choisis les statuts visibles dans le diagramme, les listes et les séquences.</p>${chips()}<div class="acts"><button class="btn" data-act="close">Terminé</button><button class="btn ghost" data-act="showall">Tout afficher</button></div>`;
  }
  return `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="grab"></div>${body}</div>`;
}

/* ---------- wires ---------- */
function drawWires() {
  const dia = $('#dia'), svg = $('#wires'), hub = $('#hub'); if (!dia || !svg || !hub) return;
  const D = dia.getBoundingClientRect(), H = hub.getBoundingClientRect();
  const cx = H.left + H.width / 2 - D.left, cy = H.top + H.height / 2 - D.top, R = H.width / 2;
  const col = {learning: '#8fb3e8', want: '#8fb3e8', known: '#f2ede3'};
  let out = `<defs>${Object.entries(col).map(([k, c]) => `<marker id="mk-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>`).join('')}</defs>`;
  for (const el of dia.querySelectorAll('.dest')) {
    const m = data.moves.find(x => x.id === el.dataset.w); if (!m) continue;
    const n = el.querySelector('.dname').getBoundingClientRect();
    const tx = n.left + n.width / 2 - D.left, ty = n.top - D.top - 6;
    const a = Math.atan2(ty - cy, tx - cx), sx = cx + Math.cos(a) * (R + 4), sy = cy + Math.sin(a) * (R + 4);
    out += `<path d="M${sx.toFixed(1)} ${sy.toFixed(1)}C${(sx + Math.cos(a) * 30).toFixed(1)} ${(sy + Math.sin(a) * 30).toFixed(1)} ${tx.toFixed(1)} ${(ty - 36).toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)}" fill="none" stroke="${col[m.status]}" stroke-width="2.6"${m.status === 'want' ? ' stroke-dasharray="9 7"' : ''} marker-end="url(#mk-${m.status})"/>`;
  }
  const f = $('#finb');
  if (f) { const F = f.getBoundingClientRect(); const fy = F.top + F.height / 2 - D.top; out += `<path d="M${(cx + R + 4).toFixed(1)} ${cy.toFixed(1)}Q${(cx + R + 14).toFixed(1)} ${fy.toFixed(1)} ${(F.left - D.left - 4).toFixed(1)} ${fy.toFixed(1)}" fill="none" stroke="#8fb3e8" stroke-width="2.6" marker-end="url(#mk-learning)"/>`; }
  svg.setAttribute('viewBox', `0 0 ${D.width} ${D.height}`);
  svg.innerHTML = out;
}

/* ---------- render & routing ---------- */
const tabs = [['positions', 'Positions', IC.positions], ['moves', 'Techniques', IC.moves], ['dojo', 'Dojo', IC.dojo], ['seq', 'Séquences', IC.seq], ['belt', 'Ceinture', IC.belt]];
function render() {
  if (view === 'pos' && !P(pid)) view = 'home';
  const cur = view === 'pos' || view === 'home' ? 'positions' : view;
  const main = view === 'pos' ? vPos() : view === 'moves' ? vMoves() : view === 'seq' ? vSeq() : view === 'dojo' ? vDojo() : view === 'belt' ? vBelt() : vHome();
  $('#app').innerHTML = main + `<nav class="tabbar" aria-label="Navigation">${tabs.map(([h, l, ic]) => `<button data-act="nav" data-id="${h}"${h === cur ? ' aria-current="page"' : ''}>${ic}<span>${l}</span></button>`).join('')}</nav>` + (sheet ? vSheet() : '') + `<div class="toast${Date.now() < toastUntil ? ' on' : ''}" id="toast" role="status">${Date.now() < toastUntil ? esc(toastMsg) : ''}</div>`;
  if (sheet?.kind === 'day') dayTechs();
  if (sheet?.kind === 'move') { usesBox(); const fr = $('#fres'); if (fr) fr.innerHTML = bankResults(sheet.q || ''); }
  if (sheet?.kind === 'pos' && !sheet.id) posResults();
  if (wireObs) { wireObs.disconnect(); wireObs = null; }
  if ($('#dia')) { wireObs = new ResizeObserver(drawWires); wireObs.observe($('#dia')); drawWires(); }
}
function route(fromBack) {
  const h = location.hash.slice(1); let m;
  if ((m = h.match(/^p-(.+)-(\d)$/)) && P(m[1])) { view = 'pos'; pid = m[1]; side = Math.min(+m[2], P(m[1]).sides.length - 1); }
  else view = ['moves', 'seq', 'belt', 'dojo'].includes(h) ? h : 'home';
  if (!fromBack && stack[stack.length - 1] !== h) stack.push(h);
  sheet = null; delArm = null; render();
  if (!keepScroll) window.scrollTo(0, 0);
  keepScroll = false;
}
let backing = false;
const nav = h => { if (location.hash.slice(1) === h) route(); else location.hash = h; };
const posHash = r => 'p-' + r.split(':')[0] + '-' + rs(r);
addEventListener('hashchange', () => { route(backing); backing = false; });

/* ---------- events ---------- */
const app = $('#app');
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a !== 'delmove' && a !== 'delpos') delArm = null;
  if (a === 'nav') nav(id === 'positions' ? 'positions' : id);
  else if (a === 'back') { stack.pop(); const prev = stack[stack.length - 1] || 'positions'; backing = true; if (location.hash.slice(1) === prev) { backing = false; route(true); } else location.hash = prev; }
  else if (a === 'goto') nav(posHash(id));
  else if (a === 'side' || a === 'flip') {
    const p = P(pid); if (p.sides.length < 2) return;
    const s = a === 'side' ? +id : 1 - side; if (s === side) return;
    keepScroll = true; stack.pop(); location.replace('#' + posHash(pid + ':' + s));
  }
  else if (a === 'tofin') $('#sec-0')?.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  else if (a === 'move') { sheet = {kind: 'move', id}; render(); }
  else if (a === 'newmove') { sheet = {kind: 'move', id: null, from: view === 'pos' ? pid + ':' + side : null}; render(); }
  else if (a === 'newpos') { sheet = {kind: 'pos', id: null}; render(); }
  else if (a === 'editpos') { sheet = {kind: 'pos', id: pid}; render(); }
  else if (a === 'filter') { sheet = {kind: 'filter'}; render(); }
  else if (a === 'close') { sheet = null; render(); }
  else if (a === 'cycle') {
    const m = data.moves.find(x => x.id === id); if (!m) return;
    m.status = NEXT[m.status]; save(); render(); toast(m.nom + ' : ' + STATUS[m.status].toLowerCase());
  }
  else if (a === 'toggle' || a === 'showall') {
    if (a === 'showall') show = {learning: true, want: true, known: true}; else show[id] = !show[id];
    try { sessionStorage.setItem('bjj-show', JSON.stringify(show)); } catch (_) {}
    render();
  }
  else if (a === 'delmove') {
    if (delArm !== id) { delArm = id; render(); return; }
    data.moves = data.moves.filter(m => m.id !== id); delArm = null; sheet = null; save(); render(); toast('Technique supprimée.');
  }
  else if (a === 'delpos') {
    if (delArm !== id) { delArm = id; render(); return; }
    data.positions = data.positions.filter(p => p.id !== id); delArm = null; save(); nav('positions'); toast('Position supprimée.');
  }
  else if (a === 'wk') { weekOff = id === '0' ? 0 : Math.min(0, weekOff + +id); render(); }
  else if (a === 'day') { const e = data.journal[id]; sheet = {kind: 'day', id, techs: e ? e.techs.map(t => ({...t})) : []}; render(); }
  else if (a === 'dayt') {
    const d = [...data.dojo.days]; d[+id] = !d[+id];
    if (!d.some(Boolean)) { toast('Garde au moins un jour.'); return; }
    data.dojo.days = d; save(); render();
    const det = $('.cfg'); if (det) det.open = true;
  }
  else if (a === 'use') { sheet.uses.has(id) ? sheet.uses.delete(id) : sheet.uses.add(id); b.setAttribute('aria-pressed', sheet.uses.has(id)); usesBox(); }
  else if (a === 'pickmine') {
    const src = data.moves.find(x => x.id === id); if (!src) return;
    const cur = $('#ffrom')?.value || sheet.from;
    sheet.pre = {nom: src.nom, type: src.type, gi: src.gi, details: src.details, tips: src.tips, danger: src.danger, video: src.video, to: src.to};
    sheet.join = src.g || src.id; sheet.joinSrc = src.id; sheet.picked = src.nom + ' (dans ton jeu)'; sheet.q = ''; sheet.from = cur; sheet.extra = [];
    sheet.uses = new Set(data.moves.filter(x => x.id === src.id || (src.g && x.g === src.g)).map(x => x.from).filter(r => r !== cur));
    render();
  }
  else if (a === 'pickbank') {
    const bk = MOVE_BANK[+id]; if (!bk) return;
    const cur = $('#ffrom')?.value || sheet.from;
    sheet.pre = {nom: bk[0], type: bk[1], gi: bk[2], to: bk[4]};
    sheet.join = null; sheet.picked = bk[0] + ' (banque)'; sheet.q = ''; sheet.from = cur;
    sheet.extra = [...new Set([...bk[3], bk[4]].filter(r => r !== 'fin').map(r => r.split(':')[0]).filter(pid2 => !P(pid2)))];
    sheet.uses = new Set(bk[3].filter(r => r !== cur));
    render();
  }
  else if (a === 'pickname') { const n = $('#fm [name=nom]'); n.value = $('#fsearch').value.trim(); $('#fres').innerHTML = ''; n.focus(); }
  else if (a === 'addbankpos') { ensurePos(id + ':0'); save(); sheet = null; nav(posHash(id + ':' + (P(id).sides.length > 1 ? 1 : 0))); toast('Position ajoutée.'); }
  else if (a === 'dpick') { const m = data.moves.find(x => x.id === id); if (m && !sheet.techs.some(t => t.id === m.id)) sheet.techs.push({id: m.id, nom: m.nom}); $('#dfree').value = ''; $('#dres').innerHTML = ''; dayTechs(); }
  else if (a === 'dpickb') { const bk = MOVE_BANK[+id]; if (bk) sheet.techs.push({id: '', nom: bk[0]}); $('#dfree').value = ''; $('#dres').innerHTML = ''; dayTechs(); }
  else if (a === 'dtrm') { sheet.techs.splice(+id, 1); dayTechs(); }
  else if (a === 'dfree') addFree();
  else if (a === 'dayclear') {
    if (delArm !== id) { delArm = id; const keep = sheet.techs; render(); sheet.techs = keep; dayTechs(); return; }
    delete data.journal[id]; delArm = null; sheet = null; save(id.slice(0, 4)); render(); toast('Journée effacée.');
  }
  else if (a === 'reveal') { revShow = true; render(); }
  else if (a === 'nextrev') { lastRev = revRef; revRef = null; revShow = false; render(); }
  else if (a === 'beltc') { data.belt.color = id; data.belt.stripes = Math.min(data.belt.stripes, maxStripes()); save(); render(); }
  else if (a === 'stripe') { const n = data.belt.stripes + +id; if (n > maxStripes()) { toast(data.belt.color === 'noire' ? '6 degrés au maximum.' : '4 barrettes au maximum (6 degrés pour la noire).'); return; } data.belt.stripes = Math.max(0, n); save(); render(); }
  else if (a === 'copy') {
    const txt = JSON.stringify(data), io = $('#io'); io.value = txt;
    try { await navigator.clipboard.writeText(txt); toast('Données copiées.'); }
    catch (_) { io.select(); toast('Sélectionne le texte et copie-le à la main.'); }
  }
  else if (a === 'import') {
    try {
      const d = normalize(JSON.parse($('#io').value));
      if (!d.positions.length) throw 0;
      data = d; save('all'); render(); toast('Sauvegarde restaurée.');
    } catch (_) { toast('Texte invalide : colle une sauvegarde copiée ici.'); }
  }
});
app.addEventListener('input', e => {
  if (e.target.id === 'q') { query = e.target.value; $('#mlist').innerHTML = movesList(); }
  else if (e.target.id === 'fsearch') { sheet.q = e.target.value; $('#fres').innerHTML = bankResults(sheet.q); }
  else if (e.target.id === 'dfree') $('#dres').innerHTML = bankResults(e.target.value, true);
  else if (e.target.id === 'psearch') posResults();
});
app.addEventListener('change', e => {
  if (e.target.id === 'seqs') { seqStart = e.target.value; render(); }
  else if (e.target.id === 'ffrom') usesBox();
  else if (e.target.id === 'ftype' && e.target.value === 'Soumission') $('#fto').value = 'fin';
});
app.addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target), v = k => String(f.get(k) || '').trim();
  if (e.target.id === 'fm') {
    const nm = {nom: v('nom'), from: v('from'), to: v('to'), type: v('type'), gi: v('gi') || 'both', status: v('status') || 'learning', details: v('details'), tips: v('tips'), danger: v('danger'), video: v('video')};
    if (!nm.nom) return;
    if (nm.to === nm.from) { toast('L\'arrivée doit être différente du départ.'); return; }
    let m = sheet.id && data.moves.find(x => x.id === sheet.id);
    const g0 = m?.g || sheet.join || '';
    if (data.moves.some(x => x !== m && x.from === nm.from && norm(x.nom) === norm(nm.nom))) { toast(nm.nom + ' existe déjà depuis ' + refLabel(nm.from) + '.'); return; }
    ensurePos(nm.from); ensurePos(nm.to);
    const shared = {nom: nm.nom, type: nm.type, gi: nm.gi, details: nm.details, tips: nm.tips, danger: nm.danger, video: nm.video};
    const uses = [...sheet.uses].filter(r => r !== nm.from);
    let g = g0 || (uses.length ? uid('g') : '');
    if (m) Object.assign(m, nm, {g}); else { m = {id: uid('m'), ...nm, g}; data.moves.push(m); }
    if (sheet.joinSrc) { const src = data.moves.find(x => x.id === sheet.joinSrc); if (src && !src.g) src.g = g; }
    let added = 0, removed = 0;
    if (g) {
      const before = data.moves.length;
      data.moves = data.moves.filter(x => !(x.g === g && x !== m && !uses.includes(x.from)));
      removed = before - data.moves.length;
      for (const r of uses) {
        if (data.moves.some(x => x.g === g && x.from === r)) continue;
        const twin = data.moves.find(x => x.from === r && norm(x.nom) === norm(nm.nom));
        if (twin) { twin.g = g; continue; }
        const t = nm.to === 'fin' ? 'fin' : nm.to;
        if (t === r) continue;
        ensurePos(r); ensurePos(t);
        data.moves.push({id: uid('m'), ...shared, from: r, to: t, status: nm.status, g}); added++;
      }
      for (const x of data.moves) if (x.g === g) Object.assign(x, shared);
    }
    save(); toast((sheet.id ? 'Technique enregistrée' : 'Technique ajoutée') + (added ? ' · ' + pl(added, 'position') + ' reliée' + (added > 1 ? 's' : '') : '') + (removed ? ' · retirée de ' + pl(removed, 'position') : '') + '.');
    sheet = null;
    if (view === 'pos' && nm.from === pid + ':' + side) render(); else if (view === 'pos' || view === 'home') nav(posHash(nm.from)); else render();
  } else if (e.target.id === 'fd') {
    const k = sheet.id, ent = {techs: sheet.techs.slice(), feel: v('feel'), good: v('good'), bad: v('bad')};
    const pending = $('#dfree').value.trim(); if (pending) ent.techs.push({id: '', nom: pending});
    if (ent.techs.length || ent.feel || ent.good || ent.bad) data.journal[k] = ent; else delete data.journal[k];
    sheet = null; save(k.slice(0, 4)); render(); toast('Journée enregistrée.');
  } else if (e.target.id === 'fp') {
    const nom = v('nom'), s0 = v('s0'), s1 = v('s1');
    if (!nom || !s0) return;
    const p = sheet.id && P(sheet.id);
    if (p) {
      if (!s1 && p.sides.length > 1 && data.moves.some(m => m.from === p.id + ':1' || m.to === p.id + ':1')) { toast('Des techniques utilisent le deuxième côté : garde-le.'); return; }
      p.nom = nom; p.sides = s1 ? [s0, s1] : [s0];
      save(); sheet = null; if (view === 'pos') { side = Math.min(side, p.sides.length - 1); } render();
    } else {
      if (data.positions.some(x => x.nom.toLowerCase() === nom.toLowerCase())) { toast('Cette position existe déjà.'); return; }
      const np = {id: uid('p'), nom, sides: s1 ? [s0, s1] : [s0]};
      data.positions.push(np); save(); sheet = null; nav(posHash(np.id + ':0'));
    }
  }
});
addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'dfree') { e.preventDefault(); addFree(); return; } if (e.key === 'Enter' && (e.target.id === 'fsearch' || e.target.id === 'psearch')) { e.preventDefault(); return; } if (e.key === 'Escape' && sheet) { sheet = null; render(); } });

data = normalize(data);
try { const s = localStorage.getItem(LS); if (s) { const d = normalize(JSON.parse(s)); if (d.positions.length) data = d; } } catch (_) {}
route();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script></body></html>
